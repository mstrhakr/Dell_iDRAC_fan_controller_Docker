name: Publish Snapshot

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  packages: write

concurrency:
  group: publish-master
  cancel-in-progress: true

jobs:
  publish:
    name: Publish GHCR image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=dell-idrac-fan-controller
          cache-to: type=gha,mode=max,scope=dell-idrac-fan-controller
          tags: |
            ghcr.io/${{ github.repository_owner }}/dell-idrac-fan-controller:latest
            ghcr.io/${{ github.repository_owner }}/dell-idrac-fan-controller:sha-${{ github.sha }}
