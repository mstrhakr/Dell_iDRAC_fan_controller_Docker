name: Go Build and Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run unit tests
        run: go test ./...

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -o dist/dell_idrac_fan_controller-${GOOS}-${GOARCH} ./cmd/controller

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: dell-idrac-fan-controller-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/dell_idrac_fan_controller-${{ matrix.goos }}-${{ matrix.goarch }}
