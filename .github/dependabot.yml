# Daily scans preserve prompt updates without one PR per dependency. Majors and
# security fixes have their own groups so neither is buried in routine updates.
# SHA-pinned Actions remain pinned when Dependabot proposes a newer release.
# Grouping is not approval: no automatic merge policy is enabled here.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    groups:
      github-actions-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      github-actions-major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["major"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    groups:
      docker-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      docker-major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["major"]
      docker-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    groups:
      go-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      go-major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["major"]
      go-security:
        applies-to: security-updates
        patterns: ["*"]
# Add another ecosystem only when its manifest is tracked in this repository.

